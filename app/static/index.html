<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-webui</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20width=%2232%22%20height=%2232%22><text y=%2226%22 font-size=%2226%22>🦙</text></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-left">
        <a href="/" class="brand-logo-link" title="e-webui Home">
          <span class="brand-logo" role="img" aria-label="e-webui" dir="ltr" style="unicode-bidi: isolate;">
            <span class="logo-prompt">&gt;</span>
            <span class="logo-text">~/.E</span>
            <span class="logo-cursor" aria-hidden="true">_</span>
          </span>
        </a>
        <div id="status-badge" class="status-badge disconnected" title="Checking Ollama connection status...">
          <span class="status-dot"></span>
          <span id="status-text" class="status-text">Connecting</span>
        </div>
      </div>

      <div class="header-right">
        <!-- Model Selection -->
        <div class="model-select-wrapper">
          <label for="model-select" class="sr-only">Model:</label>
          <div class="select-icon-wrapper">
            <svg class="select-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <select id="model-select" class="model-select" disabled title="Select Ollama Model">
              <option value="">Loading models...</option>
            </select>
          </div>
        </div>

        <!-- Thinking Mode Toggle -->
        <button id="thinking-btn" class="toolbar-toggle active" type="button" aria-pressed="true" title="Toggle model reasoning thoughts (Thinking Mode)">
          <svg class="toolbar-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.04z"></path>
            <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.04z"></path>
          </svg>
          <span class="btn-label">Thinking</span>
          <span class="toggle-pill" aria-hidden="true"></span>
        </button>

        <!-- Theme Toggle (Light / Dark) -->
        <button id="theme-btn" class="toolbar-btn icon-only" type="button" aria-label="Toggle light/dark theme" title="Toggle Theme">
          <svg id="theme-icon-sun" class="toolbar-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="theme-icon-moon" class="toolbar-icon hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- Clear Chat Button -->
        <button id="clear-btn" class="toolbar-btn" type="button" title="Clear conversation history">
          <svg class="toolbar-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span class="btn-label">Clear</span>
        </button>
      </div>
    </header>

    <!-- Chat Messages Container -->
    <main id="chat-container" class="chat-container">
      <div id="empty-state" class="empty-state">
        <div class="empty-badge" aria-hidden="true">
          <span class="empty-logo-prompt">&gt;</span>
          <span class="empty-logo-text">~/.E</span>
          <span class="empty-logo-cursor">_</span>
        </div>
        <h2>What can I build or answer for you?</h2>
        <p>Isolated Ollama models running securely on Incus with real-time streaming.</p>
        <div class="quick-prompts">
          <button class="quick-prompt-btn" type="button" data-prompt="Explain the difference between a container and a virtual machine.">
            <span class="prompt-tag">Architecture</span>
            <span class="prompt-text">"Explain Containers vs VMs"</span>
          </button>
          <button class="quick-prompt-btn" type="button" data-prompt="Write a Python script to check system CPU and memory usage.">
            <span class="prompt-tag">Python</span>
            <span class="prompt-text">"Write a Python script for CPU/RAM monitor"</span>
          </button>
          <button class="quick-prompt-btn" type="button" data-prompt="Why is the sky blue? Explain simply for a beginner.">
            <span class="prompt-tag">Science</span>
            <span class="prompt-text">"Why is the sky blue?"</span>
          </button>
        </div>
      </div>
      <div id="messages-list" class="messages-list"></div>
    </main>

    <!-- Input Footer -->
    <footer class="app-footer">
      <form id="chat-form" class="chat-form">
        <div class="input-card">
          <textarea
            id="prompt-input"
            class="prompt-input"
            rows="1"
            placeholder="Type your message... (Shift+Enter for new line)"
            required
            aria-label="Message prompt"
          ></textarea>
          <button type="submit" id="send-btn" class="send-btn" title="Send message" aria-label="Send message">
            <svg id="send-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            <svg id="stop-icon" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <rect x="5" y="5" width="14" height="14" rx="2"></rect>
            </svg>
          </button>
        </div>
        <div class="footer-meta">
          <span>Local &amp; isolated • Zero telemetry • Incus container backend</span>
        </div>
      </form>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
